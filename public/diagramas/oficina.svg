.0,297.4 L 983.7,316.2 Q 977.4,324.0 967.4,324.0 L 848.6,324.0 Q 836.6,324.0 836.6,312.0 Z" fill="#7A8FD8"/><text x="924.0" y="299.4" font-size="21" font-weight="600" fill="#242A4A" text-anchor="middle" letter-spacing="0.8" font-family="'Poppins','Inter','Ubuntu','DejaVu Sans',sans-serif">EQUIPE</text><text x="821.2" y="380.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Mecânico não reporta</text><text x="837.4" y="426.7" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Ninguém é dono do contato</text><text x="853.5" y="473.3" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Recepção sobrecarregada</text><text x="869.7" y="520.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Sem treino de atendimento</text><path d="M 1237.5,272.0 Q 1237.5,260.0 1249.5,260.0 L 1396.5,260.0 Q 1406.5,260.0 1412.8,267.8 L 1428.1,286.6 Q 1432.5,292.0 1428.1,297.4 L 1412.8,316.2 Q 1406.5,324.0 1396.5,324.0 L 1249.5,324.0 Q 1237.5,324.0 1237.5,312.0 Z" fill="#4FB0A6"/><text x="1339.0" y="299.4" font-size="21" font-weight="600" fill="#242A4A" text-anchor="middle" letter-spacing="0.8" font-family="'Poppins','Inter','Ubuntu','DejaVu Sans',sans-serif">SISTEMAS</text><text x="1236.2" y="380.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Sem sistema de status</text><text x="1252.4" y="426.7" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Dados em papel e WhatsApp</text><text x="1268.5" y="473.3" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Sem alertas automáticos</text><text x="1284.7" y="520.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Sistema pouco prático</text><path d="M 421.6,868.0 Q 421.6,856.0 433.6,856.0 L 552.4,856.0 Q 562.4,856.0 568.7,863.8 L 584.0,882.6 Q 588.4,888.0 584.0,893.4 L 568.7,912.2 Q 562.4,920.0 552.4,920.0 L 433.6,920.0 Q 421.6,920.0 421.6,908.0 Z" fill="#B5A3DD"/><text x="509.0" y="895.4" font-size="21" font-weight="600" fill="#242A4A" text-anchor="middle" letter-spacing="0.8" font-family="'Poppins','Inter','Ubuntu','DejaVu Sans',sans-serif">PRAZOS</text><text x="454.7" y="672.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Estimativa otimista</text><text x="438.5" y="718.7" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Reprogramação não avisada</text><text x="422.4" y="765.3" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Sem meta de resposta</text><text x="406.2" y="812.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Espera de peças sem data</text><path d="M 758.9,868.0 Q 758.9,856.0 770.9,856.0 L 1045.1,856.0 Q 1055.1,856.0 1061.5,863.8 L 1076.7,882.6 Q 1081.1,888.0 1076.7,893.4 L 1061.5,912.2 Q 1055.1,920.0 1045.1,920.0 L 770.9,920.0 Q 758.9,920.0 758.9,908.0 Z" fill="#7A8FD8"/><text x="924.0" y="895.4" font-size="21" font-weight="600" fill="#242A4A" text-anchor="middle" letter-spacing="0.8" font-family="'Poppins','Inter','Ubuntu','DejaVu Sans',sans-serif">PEÇAS &amp; TERCEIROS</text><text x="869.7" y="672.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Fornecedor não avisa atraso</text><text x="853.5" y="718.7" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Sem rastreio do pedido</text><text x="837.4" y="765.3" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Terceirizado sem retorno</text><text x="821.2" y="812.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Peça errada, sem aviso</text><path d="M 1180.9,868.0 Q 1180.9,856.0 1192.9,856.0 L 1453.1,856.0 Q 1463.1,856.0 1469.4,863.8 L 1484.7,882.6 Q 1489.1,888.0 1484.7,893.4 L 1469.4,912.2 Q 1463.1,920.0 1453.1,920.0 L 1192.9,920.0 Q 1180.9,920.0 1180.9,908.0 Z" fill="#4FB0A6"/><text x="1339.0" y="895.4" font-size="21" font-weight="600" fill="#242A4A" text-anchor="middle" letter-spacing="0.8" font-family="'Poppins','Inter','Ubuntu','DejaVu Sans',sans-serif">CLIENTE &amp; CANAIS</text><text x="1284.7" y="672.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Não sabe com quem falar</text><text x="1268.5" y="718.7" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Telefone nunca atende</text><text x="1252.4" y="765.3" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Avisos só quando cobram</text><text x="1236.2" y="812.0" font-size="18" font-weight="400" fill="#2B3050" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Contato desatualizado</text><text x="1832.0" y="1046.0" font-size="12.5" font-weight="500" fill="#9BA3BD" text-anchor="end" letter-spacing="0.4" font-family="'Inter','Ubuntu','DejaVu Sans',sans-serif">Oficinas Mecânicas · Análise de Causa Raiz · Out/2026</text></svg>